heroHeading: Our Philosophy
heroText: StudioForty4 is built on intention, mastery.  and empowerment. We
  believe beauty is a form of self-expression, and that self-expression is
  fundamental. Our values centre around precision, elevated experience, and
  creating space for women to feel confident and seen.Beyond our services, we
  are committed to becoming a recognised hub for independent female creatives
  within the nail industry, cultivating a collective who share the same
  vision for excellence and growth. StudioForty4 exists not only to deliver
  exceptional nail artistry, but to raise the standard, support creative
  ambition, and build a respected community within the industry.
