introSection:
  introHeading1: Introducing StudioForty4
  introParagraph1: StudioForty4 is a luxury nail atelier built on precision,
    intention, and elevated experience. We believe beauty is a form of
    self-expression and that self-expression is powerful. Every appointment is
    designed to feel considered and unrushed, where advanced technique meets
    refined detail. This is more than a nail service, this is *YOUR* hour.
  aboutButton: About
meetTeamSection:
  meetTeamHeading: Meet The Team
  meetTeamSubHeading: Meet the team
  meetTeamParagraph: >-
    With years of combined knowledge, Faith and Erin share a deep passion for
    nails as both an artform and an experience. Every detail from technique to
    atmosphere is intentionally curated to ensure each client feels elevated,
    cared for, and confident. 

    We believe your appointment should be more than just a service. It's a moment of self-expression, transformation, and indulgence.

    To maintain this standard, we thoughtfully hand-select every artist and business within our space. Each one aligns with our values of quality, creativity, and client experience - ensuring a cohesive, high-end environment you can trust.
