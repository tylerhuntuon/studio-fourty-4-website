faithSection:
  faithHeading: Faith Hunt
  faithAt: ""
  faithBody: >-
    I'm Faith, Founder & director of StudioForty4.


    I with 5 years experience in the industry I specialise in advanced nail artistry, with a strong focus on detail, precision, and creative expression. I’m deeply passionate about delivering a personalised experience for every client, ensuring each set is thoughtfully designed and tailored.

    Alongside this, having a studio and creating the space for other nail technicians to perfect their craft has been a longtime dream of mine and one I am proud to have reached.

    I love sharing my knowledge through teaching, supporting others in refining their skills and growing within the industry.
  faithImage: /uploads/faith.jpg
erinSection:
  erinHeading: Erin Davis
  erinAt: ""
  eirnBody: I am Erin I do nails n shit
  erinImage: /uploads/erin.jpg
  erinBody: >-
    My name is Erin, and I’m the co-founder of StudioForty4. Being early in my
    nail career, I take a detail-focused approach and am committed to producing
    consistently high-quality, refined nail sets.


    I particularly enjoy the preparation side of each service - the precision and attention to detail are what I find most satisfying, allowing me to start every set at a high standard while ensuring strong retention and long-lasting results.


    I also value the creative side of the work, and love being able to create in a calm, considered environment while delivering results that feel personalised to each client.


    Can’t wait to see you in salon x
